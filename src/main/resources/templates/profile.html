<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ người dùng (OIDC)</title>
</head>
<body>
<h1>👤 Đăng nhập thành công (OIDC)</h1>
<p>Spring Security đã verify <code>id_token</code> (chữ ký RS256 + claims iss/aud/exp/nonce)
    và xác định bạn là:</p>

<img th:if="${user.picture}" th:src="${user.picture}" alt="avatar" width="96"
     height="96"/>

<ul>
    <li>Tên: <b th:text="${user.fullName}">—</b></li>
    <li>Email: <b th:text="${user.email}">—</b>
        <span th:if="${user.emailVerified}"> (đã xác minh)</span></li>
    <li>Subject (sub): <code th:text="${user.subject}">—</code></li>
</ul>

<a href="/calendars"><button style="padding:5px 10px; cursor:pointer;">📅 Xem lịch của tôi</button></a>
&nbsp;|&nbsp;
<form th:action="@{/logout}" method="post" style="display:inline">
    <button type="submit" style="padding:5px 10px; cursor:pointer;">Đăng xuất</button>
</form>
&nbsp;|&nbsp;
<a href="/">← Trang chủ</a>
</body>
</html>
