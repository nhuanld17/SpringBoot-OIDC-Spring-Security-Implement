<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><title>Refreshed</title></head>
<body>
<h1>🔄 Đã refresh access token</h1>
<ul>
    <li>Access token cũ: <code
            th:text="${oldPrefix}"></code></li>
    <li>Access token mới: <code
            th:text="${newPrefix}"></code></li>
    <li>Hết hạn sau (giây): <b
            th:text="${newExpiresIn}"></b></li>
</ul>
<p>Refresh token vẫn giữ nguyên (không đổi), dùng đi dùng lại
    được.</p>
<a href="/calendars">← Xem lịch</a> | <a href="/profile">Xem hồ sơ cá nhân</a> | <a href="/">Trang chủ</a>
</body>
</html>
