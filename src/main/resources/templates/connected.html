<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><title>Connected</title></head>
<body>
<h1>✅ Đã kết nối Google Calendar!</h1>
<p>Backend vừa đổi <code>code</code> lấy token thành công.
    Thông tin token:</p>
<ul>
    <li>Có access token: <b
            th:text="${hasAccessToken}"></b></li>
    <li>Có refresh token: <b
            th:text="${hasRefreshToken}"></b></li>
    <li>Access token hết hạn sau (giây): <b
            th:text="${expiresIn}"></b></li>
    <li>Token type: <b th:text="${tokenType}"></b></li>
    <li>Scope được cấp: <b th:text="${scope}"></b></li>
</ul>
<p>
    <a href="/calendars"><button style="padding:5px 10px; cursor:pointer;">Xem lịch của tôi →</button></a>
    &nbsp;|&nbsp;
    <a href="/profile"><button style="padding:5px 10px; cursor:pointer;">Xem hồ sơ cá nhân (OIDC) →</button></a>
</p>
<a href="/">← Về trang chủ</a>
</body>
</html>
