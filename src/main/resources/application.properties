spring.config.import=optional:file:.env[.properties]
spring.application.name=springboot-oauth2

# ============================================================
# Google OIDC login qua Spring Security OAuth2 Client
# Google la built-in CommonOAuth2Provider -> khong can khai
# authorization-uri / token-uri / jwks-uri / issuer.
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/calendar.readonly
# redirect-uri mac dinh: {baseUrl}/login/oauth2/code/{registrationId}
# -> http://localhost:8080/login/oauth2/code/google
